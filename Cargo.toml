[workspace]
resolver = "2"
members = [
    "crates/midnight",
    "crates/nocturne-macro",
    "crates/nocturne-ir",
    "crates/nocturne-codegen",
    "crates/nocturne-types",
    "crates/nocturne-storage",
    "crates/nocturne-env",
    "crates/nocturne-metadata",
    "crates/nocturne-engine",
    "crates/nocturne-e2e",
    "crates/nocturne-primitives",
    "tools/cargo-midnight",
    "examples/counter-contract",
    "examples/kitchen-sink",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/RomarQ/Nocturne"
version = "0.1.0"

[workspace.dependencies]
# Internal crates. The umbrella crate keeps the `midnight` name until
# Commit B; the rest are renamed here.
midnight = { path = "crates/midnight", version = "0.1.0" }
nocturne-macro = { path = "crates/nocturne-macro", version = "0.1.0" }
nocturne-ir = { path = "crates/nocturne-ir", version = "0.1.0" }
nocturne-codegen = { path = "crates/nocturne-codegen", version = "0.1.0" }
nocturne-types = { path = "crates/nocturne-types", version = "0.1.0" }
nocturne-storage = { path = "crates/nocturne-storage", version = "0.1.0" }
nocturne-env = { path = "crates/nocturne-env", version = "0.1.0" }
nocturne-metadata = { path = "crates/nocturne-metadata", version = "0.1.0" }
nocturne-engine = { path = "crates/nocturne-engine", version = "0.1.0" }
nocturne-e2e = { path = "crates/nocturne-e2e", version = "0.1.0" }
nocturne-primitives = { path = "crates/nocturne-primitives", version = "0.1.0" }

# Midnight ledger crates (from crates.io). With our internal storage
# crate renamed to `nocturne-storage`, the upstream `midnight-storage`
# crate no longer collides and can be depended on by its natural name.
midnight-zkir = "2.1.0"
midnight-onchain-vm = "3.0.0"
midnight-onchain-state = "3.0.0"
midnight-transient-crypto = "2.1.0"
midnight-base-crypto = "1.0.0"
midnight-serialize = "1.0.0"
midnight-ledger = "8.1.0"
midnight-onchain-runtime = "3.1.0"
midnight-coin-structure = "2.0.1"
midnight-storage = "2.0.1"

# Proc macro tooling
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
thiserror = "2"
