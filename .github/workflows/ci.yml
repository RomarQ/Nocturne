name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make clippy

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Prebuilt cargo-audit binary; building it from source would dwarf the
      # scan itself. `make audit` then checks Cargo.lock against the RustSec
      # advisory database and fails on vulnerabilities (the unmaintained /
      # soundness warnings on transitive deps we don't control are allowed).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: make audit

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # MidnightDataProvider caches the universal setup params under
      # $MIDNIGHT_PP / $XDG_CACHE_HOME/midnight/zk-params /
      # $HOME/.cache/midnight/zk-params (base-crypto data_provider).
      # The prove tests fetch them on demand; cache so reruns don't
      # re-download. Keyed on Cargo.lock: a midnight-base-crypto bump
      # can change the expected params set.
      - name: Cache Midnight zk params
        uses: actions/cache@v4
        with:
          path: ~/.cache/midnight/zk-params
          key: midnight-zk-params-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            midnight-zk-params-${{ runner.os }}-
      - run: make test

  example:
    name: Examples (build + keygen + golden)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # keygen fetches the universal setup params on demand; same cache
      # as the test job.
      - name: Cache Midnight zk params
        uses: actions/cache@v4
        with:
          path: ~/.cache/midnight/zk-params
          key: midnight-zk-params-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            midnight-zk-params-${{ runner.os }}-

      - run: make build-examples

      # cargo-nocturne exits nonzero when a keygen fails, but exits 0
      # when a contract emitted no artifacts at all; assert the macro
      # actually produced circuits for both examples.
      - name: Verify example artifacts exist
        run: |
          test -f target/nocturne/counter_contract/counter/compiler/contract-info.json
          test -f target/nocturne/kitchen_sink/kitchen_sink/compiler/contract-info.json
          zkir_count=$(find target/nocturne/kitchen_sink/kitchen_sink/zkir -name '*.zkir' | wc -l)
          echo "kitchen-sink emitted ${zkir_count} ZKIR circuit(s)"
          test "$zkir_count" -gt 0

      - run: make golden-check
