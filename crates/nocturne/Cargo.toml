[package]
name = "nocturne"
description = "Rust eDSL for writing Midnight smart contracts."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
nocturne-macro = { workspace = true }
nocturne-types = { workspace = true }
nocturne-storage = { workspace = true }
# Future: nocturne-env, nocturne-primitives, nocturne-engine

# Re-exported midnight-ledger crates for runtime transcript construction
midnight-onchain-vm = { workspace = true }
midnight-onchain-state = { workspace = true }
midnight-transient-crypto = { workspace = true }
midnight-base-crypto = { workspace = true }
midnight-zkir = { workspace = true }
midnight-storage = { workspace = true }

[dev-dependencies]
nocturne-codegen = { workspace = true }
nocturne-ir = { workspace = true }
nocturne-metadata = { workspace = true }
midnight-base-crypto = { workspace = true }
midnight-ledger = { workspace = true }
midnight-onchain-runtime = { workspace = true }
midnight-coin-structure = { workspace = true }
midnight-storage = { workspace = true }
syn = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
rand = "0.8"
