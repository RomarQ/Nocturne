[package]
name = "cargo-nocturne"
description = "Cargo subcommand for building and testing nocturne contracts."
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "cargo-nocturne"
path = "src/main.rs"

[dependencies]
midnight-zkir = { workspace = true }
midnight-transient-crypto = { workspace = true }
midnight-base-crypto = { workspace = true }
midnight-serialize = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"
